[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parkguide-ai"
version = "0.0.1"
description = "Local educational RAG chatbot with source traces and saved evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "numpy>=2.0",
  "rank-bm25>=0.2.2",
  "streamlit>=1.40",
  "openai>=1.60",
  "tiktoken>=0.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3"]

[project.scripts]
parkguide = "parkguide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parkguide = ["schema.sql"]
