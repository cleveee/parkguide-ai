[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parkguide-ai"
version = "0.0.1"
description = "Local educational RAG chatbot with source traces and saved evaluation"
requires-python = ">=3.12,<3.14"
# Runtime serving dependencies only (also the Vercel install; see requirements.txt
# for exact pins). Ingestion, Streamlit and reranking are extras; the local
# setup installs requirements-full.lock and is unchanged.
dependencies = [
  "requests>=2.34,<3",
  "numpy>=2.5,<2.6",
  "rank-bm25==0.2.2",
  "openai>=3.28,<3.29",
  "httpx>=0.28,<0.29",
  "tiktoken>=0.14,<0.15",
  "python-dotenv>=1.2,<2",
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.54,<0.55",
  "beautifulsoup4>=4.15,<4.16",
]

[project.optional-dependencies]
ingest = ["beautifulsoup4>=4.12", "pdfplumber>=0.11"]
app = ["streamlit>=1.40"]
rerank = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3"]

[tool.vercel]
# Explicit so the legacy Streamlit app.py is never selected.
entrypoint = "server:app"

[project.scripts]
parkguide = "parkguide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parkguide = ["schema.sql"]
